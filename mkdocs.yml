site_name: The Compendium
site_url: https://ydhadix.github.io/the-compendium/
repo_url: https://github.com/ydhadix/the-compendium
repo_name: ydhadix/the-compendium

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.tabs.link

exclude_docs: |
  **/_*/**

not_in_nav: |
  **/subclasses/index.md
  rules/index.md
  equipment/index.md
  characters/index.md
  characters/feats/index.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/extra.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: docs
  - tables
  - toc:
      toc_depth: 4

