site_name: The Compendium
site_url: https://ydhadix.github.io/the-compendium/
repo_name: ydhadix/the-compendium
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  font: false              # no Google Fonts; use the Helvetica system stack (see extra.css)
  icon:    images/icon_dark.png
  favicon: images/icon.ico
  features:
    - toc.integrate        # page sections nest under the active page in the LEFT sidebar
    # - navigation.tabs
    # - navigation.tabs.sticky
    # - navigation.sections
    # - navigation.top
    # - search.highlight
    # - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/banner.js
  - javascripts/cards.js
  - javascripts/tables.js

# exclude_docs: |            # files/folders in docs/ that we don't want compiled
#   _snippets/*.py

not_in_nav: |            # collection dirs (one below a hub) whose entry pages aren't in nav
  character/feat/*/*
  character/race/*
  class/*/*/*
  item/*/*/*
  rules/action/normal/*
  rules/condition/*
  rules/environment/hazard/*
  spelljammer/*/*/*
  spell/level-*/*

hooks:
  - overrides/navtools.py     # nav rules for the mega-menu + left ToC (shared)

markdown_extensions:
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - attr_list               # image sizing/alignment: ![](img){ width="200" align="right" }
  - md_in_html              # markdown inside HTML, e.g. <figure> + <figcaption> captions
  - toc:
      toc_depth: 2          # ToC shows h1–h2 only; h3+ (e.g. method sections) are omitted

