site_name: The Compendium
site_url: https://ydhadix.github.io/the-compendium/
repo_name: ydhadix/the-compendium
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  font: false  # no Google Fonts; use the Helvetica system stack (see extra.css)
  logo:    images/icon_d20_dark.png
  favicon: favicon.ico
  palette:
    scheme: default
  features:
    - toc.integrate  # page sections nest under the active page in the LEFT sidebar
    # - navigation.tabs
    # - navigation.tabs.sticky
    # - navigation.sections
    # - navigation.top
    # - search.highlight
    # - content.tabs.link

extra:
  megamenu_max_depth: 4  # deepest nav flyout level (top row = 1); 0 = unlimited

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/cards.js
  - javascripts/tables.js
  - javascripts/recent.js
  - javascripts/meganav.js
  - javascripts/localnav.js
  - javascripts/keywordjump.js
  - javascripts/backtotop.js

exclude_docs: | # files/folders in docs/ that we don't want compiled
  _changelogs
  _generated
  rules/_condition/*.md
  rules/dice/_defense/*.md
  item/magic/infusion/_variant
  item/weapon/property/*.md
  !item/weapon/property/index.md
  item/weapon/mastery/*.md
  !item/weapon/mastery/index.md
  spelljammer/creation/base/*.md
  !spelljammer/creation/base/index.md
  spelljammer/creation/component/pilot/*.md
  !spelljammer/creation/component/pilot/index.md
  spelljammer/creation/component/quartermaster/*.md
  !spelljammer/creation/component/quartermaster/index.md
  spelljammer/creation/component/spelljammer/*.md
  !spelljammer/creation/component/spelljammer/index.md
  spelljammer/officer/pilot/*.md
  !spelljammer/officer/pilot/index.md
  character/class/ranger/imprint/*.md
  !character/class/ranger/imprint/index.md
  character/class/sorcerer/metamagic/*.md
  !character/class/sorcerer/metamagic/index.md
  character/class/warlock/invocation/*.md
  !character/class/warlock/invocation/index.md

not_in_nav: | # collection dirs whose entry pages aren't in nav
  character/class/*/*/*
  character/race/*
  character/feat/*/*
  item/*/*/*
  item/*/*
  spell/level/*/*
  bestiary/summon/*
  bestiary/level/*/*
  bastion/*
  spelljammer/*/*/*
  spelljammer/*/*

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn

hooks:
  - overrides/navtools.py  # nav rules for the mega-menu + left ToC

markdown_extensions:
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - attr_list   # image sizing/alignment: ![](img){ width="200" align="right" }
  - md_in_html  # markdown inside HTML, e.g. <figure> + <figcaption> captions
  - toc:
      toc_depth: 3
      permalink: "⚓︎"
nav:
  - The Compendium:
    - On This Page:                 index.md

    - Rules Rolodex:
      - Rules Overview:             rules/index.md
      - Encounters:                 rules/encounter.md
      - Resting:                    rules/rest.md
      - Targeting:                  rules/target.md
      - Actions:                    rules/action.md
      - Conditions:                 rules/condition.md
      - Hazards:                    rules/hazard.md
      - Dice Rolls:
        - Dice Overview:            rules/dice/index.md
        - Ability Checks:           rules/dice/check.md
        - Attack Rolls:             rules/dice/attack.md
        - Saving Throws:            rules/dice/save.md
        - Damage Rolls:             rules/dice/damage.md
      - Movement:                   rules/movement.md

    - Hero Handbook:
