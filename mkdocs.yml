site_name: The Compendium
site_url: https://ydhadix.github.io/the-compendium/
repo_name: ydhadix/the-compendium
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  font: false              # no Google Fonts; use the Helvetica system stack (see extra.css)
  logo:    images/icon_d20_dark.png   # brand icon (light d20 for the dark header)
  favicon: favicon.ico                # multi-size .ico at the site root
  palette:
    scheme: default        # emit data-md-color-scheme="default" on <body> so the
                           # --clr-* palette in extra.css resolves (single entry =
                           # no toggle UI). Without this the body has no scheme attr
                           # and every scheme-scoped variable is undefined.
  features:
    - toc.integrate        # page sections nest under the active page in the LEFT sidebar
    # - navigation.tabs
    # - navigation.tabs.sticky
    # - navigation.sections
    # - navigation.top
    # - search.highlight
    # - content.tabs.link

extra:
  megamenu_max_depth: 4   # deepest mega-menu flyout level (top row = 1); 0 = unlimited

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/cards.js
  - javascripts/tables.js
  - javascripts/recent.js
  - javascripts/meganav.js
  - javascripts/localnav.js

exclude_docs: |            # files/folders in docs/ that we don't want compiled
  _changelogs
  _generated
  item/magic/infusion/_variant
  item/weapon/property/*.md
  !item/weapon/property/index.md
  item/weapon/mastery/*.md
  !item/weapon/mastery/index.md

not_in_nav: |            # collection dirs (one below a hub) whose entry pages aren't in nav
  character/class/*/*/*
  character/race/*
  character/feat/*/*
  item/*/*/*
  item/*/*
  spell/level/*/*
  bestiary/summon/*
  bestiary/level/*/*
  bastion/*
  spelljammer/*/*/*
  spelljammer/*/*
  archive/hype/odyssey/playlist.md

validation:
  links:
    absolute_links: relative_to_docs   # resolve /spell/... links in _list snippets per host page
    anchors: warn                      # broken #anchors only log at INFO by default; the keyword
                                       # index is ~400 hand-authored deep links, so a renamed
                                       # heading has to surface as a warning, not a log line

hooks:
  - overrides/navtools.py     # nav rules for the mega-menu + left ToC (shared)

markdown_extensions:
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - attr_list               # image sizing/alignment: ![](img){ width="200" align="right" }
  - md_in_html              # markdown inside HTML, e.g. <figure> + <figcaption> captions
  - toc:
      toc_depth: 3
      permalink: "⚓︎"          # click the # after a heading to copy its link

